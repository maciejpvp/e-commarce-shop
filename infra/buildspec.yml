version: 0.2

env:
  variables:
    TF_VERSION: "1.10.0"
    ENVIRONMENT: "staging"

phases:
  install:
    commands:
      - echo "Installing Terraform..."
      - curl -s -qL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_arm64.zip" -o terraform.zip
      - unzip terraform.zip -d /usr/local/bin
      - chmod +x /usr/local/bin/terraform
      - terraform version
      
      - echo "Installing Trivy..."
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

  pre_build:
    commands:
      - echo "Running Infrastructure Checks..."
      - cd infra
      - terraform fmt -check -recursive
      - terraform init -input=false -backend-config="key=${ENVIRONMENT}/terraform.tfstate"
      - terraform validate
      - echo "Running security scan..."
      - trivy config . --skip-dirs .terraform

  build:
    commands:
      - echo "Running Terraform Plan for ${ENVIRONMENT}..."
      - terraform plan -out=tfplan -input=false -var="Environment=${ENVIRONMENT}"
      - echo "Applying Infrastructure Changes..."
      - terraform apply -input=false -auto-approve tfplan

  post_build:
    commands:
      - echo "Infrastructure deployment completed on $(date)"
      - terraform output -json > ../tf_outputs.json

artifacts:
  files:
    - tf_outputs.json
    - infra/tfplan
  name: infra-build-artifacts